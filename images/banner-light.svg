<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Manik Malhotra, Senior Software Engineer at Porter. Career route from Appzlogic in 2016 to Porter in 2022.">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .name { font-size: 64px; font-weight: 800; fill: #18222B; letter-spacing: -1px; }
    .role { font-size: 22px; fill: #5E6B76; }
    .co { font-size: 15px; font-weight: 700; fill: #18222B; }
    .yr { font-size: 13px; fill: #5E6B76; }
    .ping { transform-origin: 930px 196px; animation: ping 2.4s ease-out infinite; }
    @keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ping { animation: none; opacity: 0; } }
  </style>
  <rect width="1000" height="280" rx="12" fill="#F5F6F8"/>
  <text x="40" y="92" class="name">Manik Malhotra</text>
  <text x="42" y="132" class="role">Senior Software Engineer (SDE-3) at Porter, Bengaluru</text>
  <line x1="70" y1="196" x2="930" y2="196" stroke="#E8A317" stroke-width="2.5" stroke-dasharray="12 8"/>
  <circle cx="70" cy="196" r="8" fill="#F5F6F8" stroke="#E8A317" stroke-width="2.5"/>
  <text x="70" y="232" text-anchor="middle" class="co">Appzlogic</text>
  <text x="70" y="252" text-anchor="middle" class="yr">2016</text>
  <circle cx="290" cy="196" r="8" fill="#F5F6F8" stroke="#E8A317" stroke-width="2.5"/>
  <text x="290" y="232" text-anchor="middle" class="co">HCL</text>
  <text x="290" y="252" text-anchor="middle" class="yr">2017</text>
  <circle cx="510" cy="196" r="8" fill="#F5F6F8" stroke="#E8A317" stroke-width="2.5"/>
  <text x="510" y="232" text-anchor="middle" class="co">Coolwinks</text>
  <text x="510" y="252" text-anchor="middle" class="yr">2019</text>
  <circle cx="730" cy="196" r="8" fill="#F5F6F8" stroke="#E8A317" stroke-width="2.5"/>
  <text x="730" y="232" text-anchor="middle" class="co">Publicis Sapient</text>
  <text x="730" y="252" text-anchor="middle" class="yr">2021</text>
  <circle cx="930" cy="196" r="8" fill="#E8A317" stroke="#E8A317" stroke-width="2.5"/>
  <circle class="ping" cx="930" cy="196" r="8" fill="none" stroke="#E8A317" stroke-width="2"/>
  <text x="940" y="232" text-anchor="end" class="co">Porter</text>
  <text x="940" y="252" text-anchor="end" class="yr">2022 – now</text>
</svg>
